<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 90" width="300" height="90">
  <rect width="300" height="90" fill="#FFC72C" rx="4"/>
  <!-- Stylized 'r' -->
  <path d="M 45 65 L 45 28 L 60 28 L 60 38 C 65 30 75 28 85 28 L 85 43 C 74 43 60 44 60 55 L 60 65 Z" fill="#1C1B1F" style="display:none;"/>
  
  <!-- Exact RIT Geometric Letterforms -->
  <!-- 'r': Left vertical bar + top horizontal arm -->
  <rect x="42" y="28" width="16" height="38" fill="#1C1B1F"/>
  <rect x="42" y="28" width="88" height="12" fill="#1C1B1F"/>
  
  <!-- 'i': Red dot + Black vertical bar -->
  <rect x="135" y="14" width="13" height="13" fill="#D8232A"/>
  <rect x="135" y="32" width="16" height="34" fill="#1C1B1F"/>
  
  <!-- 't': Crossbar and bottom hook/bar -->
  <rect x="157" y="32" width="95" height="12" fill="#1C1B1F"/>
  <rect x="157" y="32" width="16" height="34" fill="#1C1B1F"/>
  <rect x="157" y="54" width="95" height="12" fill="#1C1B1F"/>

  <!-- Subtext: RAJARAMBAPU INSTITUTE OF TECHNOLOGY -->
  <text x="150" y="79" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="10.5" font-weight="800" letter-spacing="1.1" fill="#4B4B4B" text-anchor="middle">
